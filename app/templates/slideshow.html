<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Слайдшоу камер</title>
  <link rel="stylesheet" href="/static/style.css?v=18">
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    .stage { position: fixed; inset: 0; }
    .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
      opacity: 0; transition: opacity .6s ease; }
    .stage img.show { opacity: 1; }
    .overlay { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 20px;
      background: linear-gradient(transparent, rgba(0,0,0,.75)); display: flex;
      justify-content: space-between; align-items: flex-end; font-size: 22px; color: #fff; }
    .ov-name b { font-size: 28px; }
    .ov-right { text-align: right; font-size: 18px; color: #cfd6df; }
    .controls { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; opacity: .25; transition: .2s; }
    .controls:hover { opacity: 1; }
    .controls button, .controls a { background: rgba(0,0,0,.55); color: #fff; border: 1px solid #444;
      border-radius: 8px; padding: 8px 12px; font-size: 16px; cursor: pointer; text-decoration: none; }
    .progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); width: 0; }
  </style>
</head>
<body>
  <div class="progress" id="prog"></div>
  <div class="stage"><img id="imgA"><img id="imgB"></div>
  <div class="overlay">
    <div class="ov-name"><b id="cam-name">—</b><div id="cam-dev" class="muted"></div></div>
    <div class="ov-right"><div id="clock"></div><div id="counter"></div></div>
  </div>
  <div class="controls">
    <button id="btn-prev">⏮</button>
    <button id="btn-play">⏸</button>
    <button id="btn-next">⏭</button>
    <button id="btn-full">⛶</button>
    <a href="/">✕</a>
  </div>

<script>
const CAMS = {{ cams | tojson }};
const BASE = 6000;          // обычная задержка, мс
let i = -1, playing = true, timer = null, front = "imgA";
const imgA = document.getElementById("imgA"), imgB = document.getElementById("imgB");

function statusColor(s){ return ({online:"#2ecc71",offline:"#e74c3c",no_video:"#f1c40f"})[s] || "#8b97a7"; }

function show(idx) {
  if (!CAMS.length) return;
  i = (idx + CAMS.length) % CAMS.length;
  const cam = CAMS[i];
  const url = `/api/devices/${cam.device_id}/channels/${cam.channel_id}/snapshot?t=` + Date.now();
  const next = front === "imgA" ? imgB : imgA;
  const cur = front === "imgA" ? imgA : imgB;
  next.onload = () => { next.classList.add("show"); cur.classList.remove("show"); front = next.id; };
  next.onerror = () => { next.classList.add("show"); cur.classList.remove("show"); front = next.id; };
  next.src = url;
  document.getElementById("cam-name").textContent = cam.name;
  document.getElementById("cam-name").style.color = statusColor(cam.status);
  document.getElementById("cam-dev").textContent = cam.device + " · " + cam.status;
  document.getElementById("counter").textContent = (i + 1) + " / " + CAMS.length;
  schedule(cam);
}
function schedule(cam) {
  clearTimeout(timer);
  document.getElementById("prog").style.width = "0";
  if (!playing) return;
  // На проблемных камерах задерживаемся дольше — чтобы успеть разглядеть
  const dur = cam.status === "online" ? BASE : BASE * 2.2;
  requestAnimationFrame(() => {
    const p = document.getElementById("prog");
    p.style.transition = `width ${dur}ms linear`; p.style.width = "100%";
  });
  timer = setTimeout(() => show(i + 1), dur);
}
document.getElementById("btn-next").onclick = () => show(i + 1);
document.getElementById("btn-prev").onclick = () => show(i - 1);
document.getElementById("btn-play").onclick = (e) => {
  playing = !playing; e.target.textContent = playing ? "⏸" : "▶";
  if (playing) show(i); else clearTimeout(timer);
};
document.getElementById("btn-full").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") show(i + 1);
  else if (e.key === "ArrowLeft") show(i - 1);
  else if (e.key === " ") { e.preventDefault(); document.getElementById("btn-play").click(); }
});
setInterval(() => document.getElementById("clock").textContent = new Date().toLocaleTimeString("ru-RU"), 1000);

if (CAMS.length) show(0);
else document.getElementById("cam-name").textContent = "Нет камер — добавьте устройство и опросите";
</script>
</body>
</html>
