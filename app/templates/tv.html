<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>TV — NVR Monitor</title>
  <link rel="stylesheet" href="/static/style.css?v=16">
</head>
<body class="tv-body">
  <div class="tv-head">
    <span id="tv-clock"></span>
    <span id="tv-summary" class="muted"></span>
    <a href="/">выйти из TV-режима →</a>
  </div>
  <div id="tv-grid" class="tv-grid"></div>

<script>
let known = {};   // id -> reachable/health, для звука на новую проблему
let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; o.type = "square"; g.gain.value = 0.2;
    o.start(); setTimeout(() => o.stop(), 400);
  } catch (e) {}
}
const CORNERS = '<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>';
function tile(d, up, total, arch) {
  let cls = "green";
  if (!d.enabled) cls = "gray";
  else if (!d.reachable) cls = "red";
  else if (up < total) cls = "yellow";
  let archLine = '<div class="tv-arch">архив: нет данных</div>';
  if (arch && arch.total) {
    let extra = "";
    if (arch.none) extra = ` · ${arch.none} без записи`;
    else if (arch.partial) extra = ` · ${arch.partial} с дырами`;
    archLine = `<div class="tv-arch">архив ${arch.full}/${arch.total}${extra}</div>`;
  }
  // угловые метки «+» — только на плитках-рамках (норма)
  return `<div class="tv-tile ${cls}" onclick="location.href='/devices/${d.id}'">
    ${cls === "green" ? CORNERS : ""}
    <div class="tv-name">${d.name}</div>
    <div class="tv-stat">${d.reachable ? up + "/" + total + " камер" : "НЕДОСТУПЕН"}</div>
    ${archLine}
  </div>`;
}
async function refresh() {
  document.getElementById("tv-clock").textContent = new Date().toLocaleString("ru-RU");
  try {
    const [list, sum, arch] = await Promise.all([
      fetch("/api/devices").then(r => r.json()),
      fetch("/api/summary").then(r => r.json()),
      fetch("/api/archive/overview").then(r => r.json()),
    ]);
    const archById = {};
    (arch.devices || []).forEach(a => { archById[a.device_id] = a; });
    const archNote = arch.day
      ? ` · архив (${arch.day.slice(8,10)}.${arch.day.slice(5,7)}): ${arch.totals.none} без записи, ${arch.totals.partial} с дырами`
      : "";
    document.getElementById("tv-summary").textContent =
      `всего ${sum.devices_total} · онлайн ${sum.devices_online} · проблемы ${sum.devices_with_problems} · недоступны ${sum.devices_unreachable}${archNote}`;
    const detailed = await Promise.all(list.map(d => fetch(`/api/devices/${d.id}`).then(r => r.json())));
    let html = "";
    for (const d of detailed) {
      const total = d.channels.length;
      const up = d.channels.filter(c => c.status === "online").length;
      const bad = !d.reachable || up < total;
      if (bad && known[d.id] === false) beep();  // стало плохо
      known[d.id] = bad;
      html += tile(d, up, total, archById[d.id]);
    }
    document.getElementById("tv-grid").innerHTML = html;
  } catch (e) {}
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
