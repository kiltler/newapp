services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # В Compose по умолчанию используем PostgreSQL из сервиса db.
      # Чтобы перейти на SQLite — закомментируйте строку ниже и задайте DATABASE_URL в .env.
      DATABASE_URL: postgresql+psycopg://nvrmon:nvrmon@db:5432/nvrmon
      # Часовой пояс контейнера = пояс ваших регистраторов (берётся из .env, по умолчанию UTC).
      TZ: ${TZ:-UTC}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nvrmon
      POSTGRES_PASSWORD: nvrmon
      POSTGRES_DB: nvrmon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nvrmon"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Эмулятор NVR (только для разработки/демо). Запуск: --profile dev ──────────
  mock:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "mock.server"]
    environment:
      MOCK_PROFILE: both
      MOCK_PORT: "8088"
    ports:
      - "8088:8088"
    profiles: ["dev"]

  # ── Grafana + Prometheus. Запуск: docker compose --profile grafana up -d ──────
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    profiles: ["grafana"]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ["grafana"]

  # ── Caddy: авто-HTTPS (Let's Encrypt) для доступа извне и установки PWA. ──────
  #    Запуск: задайте DOMAIN в .env и  docker compose --profile https up -d
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
    profiles: ["https"]

volumes:
  pgdata:
  promdata:
  grafanadata:
  caddydata:
  caddyconfig:
